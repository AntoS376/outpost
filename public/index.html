<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Outpost</title>
  <link rel="icon" type="image/png" href="/img/badge-64.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/app-180.png?v=2">
  <meta name="apple-mobile-web-app-title" content="Outpost">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ede8e2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121512" media="(prefers-color-scheme: dark)">
  <link rel="preload" href="/vendor/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/vendor/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Sections">
      <div class="brand"><img src="/img/badge-256.png?v=2" alt="" width="88" height="88"><b>Outpost</b><small>Knowledge travels further</small></div>
      <a href="#emergency" data-route="emergency" data-tab class="railsos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg><span class="label-full">SOS · Emergency</span><span class="label-short" aria-hidden="true">SOS</span></a>
      <a href="#home" data-route="home" data-tab><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <p class="railsec">Know</p>
      <a href="#library" data-route="library" data-tab><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-1 .2"/><path d="M20 4v14h-7"/></svg><span>Library</span></a>
      <a href="#education" data-route="education"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg><span>Education</span></a>
      <a href="#documents" data-route="documents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l4 4v12H8z"/><path d="M16 3v4h4"/><path d="M4 7v14h12"/></svg><span>Documents</span></a>
      <p class="railsec">Ask and find</p>
      <a href="#ai" data-route="ai" data-tab><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="label-full">Assistant</span><span class="label-short" aria-hidden="true">Chat</span></a>
      <a href="#maps" data-route="maps" data-tab><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l6 2 6-2v14l-6 2-6-2-6 2V6z"/><path d="M9 4v14M15 6v14"/></svg><span>Maps</span></a>
      <p class="railsec">Be ready</p>
      <a href="#ready" data-route="ready"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"/></svg><span>Preparedness</span></a>
      <a href="#radio" data-route="radio"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9l10-5"/><circle cx="8.5" cy="15" r="2.5"/><path d="M14 13.5h4M14 16.5h4"/></svg><span>Radio</span></a>
      <a href="#voice" data-route="voice"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3M8.5 21h7"/></svg><span>Voice</span></a>
      <p class="railsec">Keep</p>
      <a href="#notes" data-route="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg><span>Notes</span></a>
      <a href="#tools" data-route="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5a4 4 0 0 0 5 5L10 21a2.1 2.1 0 0 1-3-3z"/></svg><span>Tools</span></a>
      <a href="#apps" data-route="apps"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Apps</span></a>
      <a href="#games" data-route="games"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="9" cy="15" r="1.3"/><circle cx="15" cy="15" r="1.3"/></svg><span>Games</span></a>
      <div class="spacer"></div>
      <svg class="ridge" viewBox="0 0 200 60" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 50C40 48 46 30 70 32S100 50 124 40S150 16 172 18" stroke-dasharray="3 4"/><circle cx="10" cy="50" r="2.5"/><path d="M172 8c-5 0-8 3.6-8 7.6 0 5.6 8 12.4 8 12.4s8-6.8 8-12.4c0-4-3-7.6-8-7.6z"/><circle cx="172" cy="15.6" r="2.4"/><path d="M60 10l4 6M64 10l-4 6M120 52l4 6M124 52l-4 6" stroke-width="1"/></svg>
      <div class="whoami" id="whoami" hidden></div>
      <button id="jobs-btn" class="railbtn" type="button" aria-expanded="false" aria-controls="tray">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
        <span>Transfers</span><b id="jobs-badge" hidden>0</b>
      </button>
      <button id="more-btn" class="railbtn more" type="button" aria-expanded="false" aria-controls="moresheet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>More</span></button>
    </nav>
    <div class="moresheet" id="moresheet" role="dialog" aria-label="All sections" hidden></div>
    <div class="mainwrap">
      <div class="sosbar" id="sosbar" hidden></div>
      <header class="topbar"><span class="where"><b>Outpost</b> · <span id="where">Home</span></span>
        <div class="right">
          <span class="state" id="srvstate" role="status"><i aria-hidden="true"></i><span>Running</span></span>
          <span class="battery" id="battery" role="img" hidden><svg viewBox="0 0 28 14" aria-hidden="true"><rect class="shell" x="1" y="1" width="23" height="12" rx="3"/><rect class="tip" x="25" y="4.5" width="2" height="5" rx="1"/><rect class="level" x="3" y="3" width="0" height="8" rx="1.5"/><path class="bolt" d="M14 2.5 9.5 7.5h3.5L11 11.5l4.5-5H12z"/></svg><span></span></span>
          <span class="pill netpill" id="netpill" hidden></span><span class="netip" id="netip" hidden></span>
          <span class="sep" aria-hidden="true"></span>
          <a class="quick" href="#guide"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17.2h.01"/></svg><span>Help</span></a>
          <button class="quick" id="theme" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span>Auto</span></button>
          <a class="quick" href="#account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></a>
          <button class="quick admin-only" id="shutdown" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg><span>Shutdown</span></button>
        </div></header>
      <main id="main"></main>
    </div>
  </div>
  <section id="tray" hidden aria-label="Transfers">
    <header><strong>Transfers</strong><button class="btn small" id="tray-close" type="button">Close</button></header>
    <div id="tray-body"></div>
  </section>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
